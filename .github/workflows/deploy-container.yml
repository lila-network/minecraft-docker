name: Build container image

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "Minecraft version to build, for example 1.21.10"
        required: true
        type: string
      force_rebuild:
        description: "Rebuild even if the image tag already exists"
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
  FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild || false }}

jobs:
  build-container-image:
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    concurrency:
      group: build-container-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate Minecraft version input
        run: |
          set -Eeuo pipefail

          if [[ -z "${IMAGE_TAG}" ]]; then
            echo "IMAGE_TAG is empty" >&2
            exit 1
          fi

          echo "Building Minecraft version: ${IMAGE_TAG}"

      - name: Log in to the container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if container image tag already exists
        id: existing-image
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: |
          set -Eeuo pipefail

          if [[ "${FORCE_REBUILD}" == "true" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Force rebuild enabled"
            exit 0
          fi

          if docker manifest inspect "$IMAGE_REF" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE_REF already exists; skipping build"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Image $IMAGE_REF does not exist yet; building"
          fi

      - name: Extract metadata for Docker
        if: steps.existing-image.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Get current date
        if: steps.existing-image.outputs.skip != 'true'
        run: echo "BUILD_DATE=$(date --rfc-3339=seconds)" >> "$GITHUB_ENV"

      - name: Download Minecraft server jar
        if: steps.existing-image.outputs.skip != 'true'
        run: ./download-minecraft.sh "${{ env.IMAGE_TAG }}"

      - name: Build and push container image
        if: ${{ steps.existing-image.outputs.skip != 'true' && !env.ACT }}
        id: release
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MC_VERSION=${{ env.IMAGE_TAG }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            VCS_REF=${{ github.sha }}
            IMAGE_VERSION=${{ env.IMAGE_TAG }}
            IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}

name: Check Minecraft stable release

on:
  schedule:
    - cron: "28 6 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  packages: read

concurrency:
  group: minecraft-release-check
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEPLOY_WORKFLOW: deploy-container.yml

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Detect latest stable Minecraft release
        id: minecraft
        run: ./get-latest-release.sh

      - name: Check if GitHub release already exists
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.minecraft.outputs.version }}
        run: |
          set -Eeuo pipefail

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $VERSION already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release $VERSION does not exist yet"
          fi

      - name: Create GitHub release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.minecraft.outputs.version }}
        run: |
          set -Eeuo pipefail

          gh release create "$VERSION" \
            --target "${GITHUB_SHA}" \
            --title "Minecraft $VERSION" \
            --notes "Automated container build for Minecraft Java Edition $VERSION." \
            --latest

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if container image tag already exists
        id: image
        env:
          VERSION: ${{ steps.minecraft.outputs.version }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.minecraft.outputs.version }}
        run: |
          set -Eeuo pipefail

          if docker manifest inspect "$IMAGE_REF" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Container image $IMAGE_REF already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Container image $IMAGE_REF does not exist yet"
          fi

      - name: Trigger container build workflow
        if: steps.image.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.minecraft.outputs.version }}
        run: |
          set -Eeuo pipefail

          gh workflow run "${DEPLOY_WORKFLOW}" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f version="$VERSION"
